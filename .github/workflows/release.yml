name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Zip extension packages
        run: |
          cd dist/firefox && zip -r "$GITHUB_WORKSPACE/Cider4Me-firefox.zip" . && cd ../..
          cd dist/chrome && zip -r "$GITHUB_WORKSPACE/Cider4Me-chrome.zip" .
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Cider4Me-firefox.zip
            Cider4Me-chrome.zip